<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel principal — SIVAG</title>
  <link rel="stylesheet" href="css/sivag.css" />
  <style>
    /* ── Reset de layout para sidebar permanente ───────── */
    html, body { height: 100%; overflow: hidden; }

    .sv-app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════
       SIDEBAR IZQUIERDA — navegación principal
    ═══════════════════════════════════════════════════ */
    .sv-sidenav {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-dark);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 100;
      transition: width 0.28s cubic-bezier(.4,0,.2,1);
    }

    .sv-sidenav.collapsed { width: 60px; }

    /* Logo */
    .sv-sidenav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border-dim);
      text-decoration: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sv-sidenav-logo-mark {
      width: 32px; height: 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--bg-deep);
      flex-shrink: 0;
    }

    .sv-sidenav-logo-text {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .sv-sidenav-logo-sub {
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Usuario */
    .sv-sidenav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-dim);
      overflow: hidden;
      flex-shrink: 0;
    }

    .sv-sidenav-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .sv-sidenav-user-name {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sv-sidenav-user-role {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-top: 1px;
    }

    /* Nav items */
    .sv-sidenav-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px;
      scrollbar-width: none;
    }

    .sv-sidenav-section {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 10px 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .sv-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
    }

    .sv-nav-item:hover {
      background: var(--bg-glass);
      color: var(--text-primary);
      border-color: var(--border-dim);
    }

    .sv-nav-item.active {
      background: rgba(0,212,255,0.1);
      color: var(--accent-cyan);
      border-color: rgba(0,212,255,0.2);
    }

    .sv-nav-icon {
      font-size: 15px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }

    .sv-nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    /* Collapsed state: solo iconos */
    .sv-sidenav.collapsed .sv-sidenav-logo-text,
    .sv-sidenav.collapsed .sv-sidenav-logo-sub,
    .sv-sidenav.collapsed .sv-sidenav-user-name,
    .sv-sidenav.collapsed .sv-sidenav-user-role,
    .sv-sidenav.collapsed .sv-nav-label,
    .sv-sidenav.collapsed .sv-sidenav-section { display: none; }

    .sv-sidenav.collapsed .sv-nav-item { justify-content: center; padding: 10px; }
    .sv-sidenav.collapsed .sv-sidenav-user { justify-content: center; }
    .sv-sidenav.collapsed .sv-sidenav-logo { justify-content: center; padding: 20px 0 16px; }

    /* Footer del sidebar */
    .sv-sidenav-footer {
      padding: 10px 8px;
      border-top: 1px solid var(--border-dim);
      flex-shrink: 0;
    }

    /* .sv-sidenav-toggle (legacy) y .sv-sidenav-footer-btn (nuevo) */
    .sv-sidenav-toggle,
    .sv-sidenav-footer-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      background: none;
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .sv-sidenav-toggle:hover,
    .sv-sidenav-footer-btn:hover { color: var(--accent-cyan); border-color: rgba(0,212,255,0.3); }
    .sv-sidenav-footer-btn.danger:hover { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
    .sv-sidenav.collapsed .sv-sidenav-toggle,
    .sv-sidenav.collapsed .sv-sidenav-footer-btn { justify-content: center; }
    .sv-sidenav.collapsed .sv-sidenav-toggle-label,
    .sv-sidenav.collapsed .sv-sidenav-footer-label { display: none; }

    /* ═══════════════════════════════════════════════════
       CONTENIDO PRINCIPAL — scrollable
    ═══════════════════════════════════════════════════ */
    .sv-main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Topbar del contenido (bienvenida + botón) */
    .sv-content-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border-dim);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .sv-welcome-text {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .sv-welcome-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .sv-content-body {
      flex: 1;
      padding: 24px 32px 40px;
    }

    /* ── Grid principal: proyectos + actividad ─────────── */
    .sv-panel-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1100px) {
      .sv-panel-grid { grid-template-columns: 1fr; }
    }

    /* ── Métricas ───────────────────────────────────────── */
    .sv-metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 900px) { .sv-metrics-row { grid-template-columns: repeat(2,1fr); } }

    .sv-metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      transition: var(--transition);
    }

    .sv-metric-card:hover { border-color: rgba(0,212,255,0.2); }

    .sv-metric-value {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 4px;
    }

    .sv-metric-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Sección de proyectos ───────────────────────────── */
    .sv-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sv-section-head-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sv-section-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Proyecto card — nuevo estilo encajonado ────────── */
    .sv-proyecto-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 10px;
      transition: var(--transition);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .sv-proyecto-card:hover { border-color: rgba(0,212,255,0.22); }

    .sv-proyecto-card-thumb {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-input);
      border: 1px solid var(--border-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sv-proyecto-card-body {
      flex: 1;
      min-width: 0;
    }

    .sv-proyecto-card-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sv-proyecto-card-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .sv-proyecto-card-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Panel de actividad reciente ────────────────────── */
    .sv-activity-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: 0;
    }

    .sv-activity-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border-dim);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sv-activity-list { padding: 8px 0; }

    .sv-activity-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      transition: var(--transition);
    }

    .sv-activity-item:last-child { border-bottom: none; }
    .sv-activity-item:hover { background: var(--bg-glass); }

    .sv-activity-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .sv-activity-text {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }

    .sv-activity-text strong { color: var(--text-primary); font-weight: 600; }
    .sv-activity-text a { color: var(--accent-cyan); text-decoration: none; }
    .sv-activity-text a:hover { text-decoration: underline; }

    .sv-activity-time {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Search bar ─────────────────────────────────────── */
    .sv-search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .sv-search-row .sv-input-icon { flex: 1; }

    /* ── Toggle switch compacto ─────────────────────────── */
    .sv-toggle-sm {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-dim);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: var(--transition);
      display: inline-block;
    }

    .sv-toggle-sm::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: var(--transition);
    }

    .sv-toggle-sm.on {
      border-color: var(--accent-teal);
      background: rgba(0,184,160,0.2);
    }

    .sv-toggle-sm.on::after { left: 18px; background: var(--accent-teal); }

    /* ── Modal ──────────────────────────────────────────── */
    .sv-modal-overlay-wrap {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .sv-modal {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 100%; max-width: 480px;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.8);
      animation: fadeInUp 0.25s ease;
    }

    .sv-modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }

    .sv-modal-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 20px; line-height: 1;
      transition: color 0.2s;
    }

    .sv-modal-close:hover { color: var(--text-primary); }

    @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp  { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* Skeleton de proyectos */
    .sv-proyecto-skel {
      height: 90px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>
  <div class="sv-bg-grid" style="position:fixed;"></div>
  <div class="sv-bg-orb sv-bg-orb-1" style="position:fixed;"></div>
  <div class="sv-bg-orb sv-bg-orb-2" style="position:fixed;"></div>

  <div class="sv-app-shell">


    <!-- ══ SIDENAV DE NAVEGACIÓN ══ -->
    <aside class="sv-sidenav" id="sv-sidenav">
      <a href="panel.html" class="sv-sidenav-logo">
        <div class="sv-sidenav-logo-mark">S</div>
        <div>
          <div class="sv-sidenav-logo-text">SIVAG</div>
          <div class="sv-sidenav-logo-sub">Geoespacial</div>
        </div>
      </a>
      <div class="sv-sidenav-user">
        <div class="sv-sidenav-avatar" id="sv-nav-avatar">Y</div>
        <div style="overflow:hidden;">
          <div class="sv-sidenav-user-name" id="sv-nav-nombre">Usuario</div>
          <div class="sv-sidenav-user-role" id="sv-nav-rol">Investigador</div>
        </div>
      </div>
      <nav class="sv-sidenav-nav">
        <div class="sv-sidenav-section">Principal</div>
        <a href="panel.html" class="sv-nav-item active" data-nav="panel">
          <span class="sv-nav-icon">◈</span><span class="sv-nav-label">Panel principal</span>
        </a>
        <a href="explorador.html" class="sv-nav-item" data-nav="explorador">
          <span class="sv-nav-icon">🌐</span><span class="sv-nav-label">Explorador</span>
        </a>
        <div class="sv-sidenav-section" style="margin-top:6px;">Cuenta</div>
        <a href="#" class="sv-nav-item" data-nav="perfil">
          <span class="sv-nav-icon">👤</span><span class="sv-nav-label">Mi perfil</span>
        </a>
        <a href="#" class="sv-nav-item" data-nav="ajustes">
          <span class="sv-nav-icon">⚙</span><span class="sv-nav-label">Ajustes</span>
        </a>
      </nav>
      <div class="sv-sidenav-footer">
        <button class="sv-sidenav-footer-btn" id="sv-nav-collapse-btn">
          <span id="sv-nav-collapse-icon">◁</span>
          <span class="sv-sidenav-footer-label">Colapsar</span>
        </button>
        <button class="sv-sidenav-footer-btn danger" id="sv-nav-logout-btn">
          <span>⎋</span>
          <span class="sv-sidenav-footer-label">Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <!-- ═══════════════════════════════
         CONTENIDO PRINCIPAL
    ═══════════════════════════════ -->
    <main class="sv-main-content">

      <!-- Topbar de bienvenida -->
      <div class="sv-content-topbar">
        <div>
          <h1 class="sv-welcome-text" id="sv-panel-title">Bienvenido</h1>
          <p class="sv-welcome-sub" id="sv-panel-subtitle">Panel del investigador · SIVAG</p>
        </div>
        <button class="sv-btn sv-btn-primary" id="sv-new-proyecto-btn" style="flex-shrink:0;">
          + Nuevo proyecto
        </button>
      </div>

      <!-- Body scrollable -->
      <div class="sv-content-body">

        <!-- Métricas -->
        <div class="sv-metrics-row" id="sv-stats-row">
          <div class="sv-metric-card sv-proyecto-skel"></div>
          <div class="sv-metric-card sv-proyecto-skel"></div>
          <div class="sv-metric-card sv-proyecto-skel"></div>
          <div class="sv-metric-card sv-proyecto-skel"></div>
        </div>

        <!-- Grid proyectos + actividad -->
        <div class="sv-panel-grid">

          <!-- Columna izquierda: lista de proyectos -->
          <div>
            <div class="sv-section-head">
              <span class="sv-section-head-title">Mis proyectos</span>
              <div class="sv-section-filters">
                <select id="sv-vis-filter" class="sv-filter-select" style="font-size:11px;">
                  <option value="">Todos</option>
                  <option value="PUBLICO">Públicos</option>
                  <option value="PRIVADO">Privados</option>
                </select>
                <select id="sv-cat-filter" class="sv-filter-select" style="font-size:11px;">
                  <option value="">Categorías</option>
                  <option value="CLIMA">Clima</option>
                  <option value="FAUNA">Fauna</option>
                  <option value="AGUA">Agua</option>
                  <option value="SUELO">Suelo</option>
                  <option value="VEGETACION">Vegetación</option>
                  <option value="ATMOSFERA">Atmósfera</option>
                  <option value="OTRO">Otro</option>
                </select>
              </div>
            </div>

            <!-- Buscador -->
            <div class="sv-search-row">
              <div class="sv-input-icon">
                <span class="sv-icon" style="font-size:12px;">🔍</span>
                <input type="text" id="sv-panel-search" class="sv-input"
                  placeholder="Buscar mis proyectos..."
                  style="padding-left:36px;font-size:12px;" />
              </div>
            </div>

            <div id="sv-panel-alert" style="margin-bottom:12px;"></div>
            <div id="sv-proyectos-list"></div>
            <div class="sv-pagination" id="sv-panel-pagination"></div>
          </div>

          <!-- Columna derecha: actividad reciente -->
          <div>
            <div class="sv-activity-panel">
              <div class="sv-activity-header">⚡ Actividad reciente</div>
              <div class="sv-activity-list" id="sv-activity-list">
                <!-- Skeletons -->
                <div class="sv-activity-item">
                  <div class="sv-activity-dot" style="background:var(--border-dim);"></div>
                  <div style="flex:1;height:28px;background:var(--bg-glass);border-radius:4px;animation:pulse 1.5s infinite;"></div>
                </div>
                <div class="sv-activity-item">
                  <div class="sv-activity-dot" style="background:var(--border-dim);"></div>
                  <div style="flex:1;height:28px;background:var(--bg-glass);border-radius:4px;animation:pulse 1.5s infinite 0.2s;"></div>
                </div>
                <div class="sv-activity-item">
                  <div class="sv-activity-dot" style="background:var(--border-dim);"></div>
                  <div style="flex:1;height:28px;background:var(--bg-glass);border-radius:4px;animation:pulse 1.5s infinite 0.4s;"></div>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /sv-panel-grid -->
      </div><!-- /sv-content-body -->
    </main>
  </div><!-- /sv-app-shell -->

  <!-- ── MODAL: Nuevo / Editar proyecto ── -->
  <div id="sv-modal-overlay" style="display:none;">
    <div class="sv-modal-overlay-wrap">
      <div class="sv-modal">
        <button class="sv-modal-close" id="sv-modal-close-btn">×</button>
        <h2 style="font-family:var(--font-display);font-size:18px;color:var(--text-primary);margin:0 0 4px;"
            id="sv-modal-title">Nuevo proyecto</h2>
        <p style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-bottom:20px;">
          Completa los metadatos del proyecto
        </p>
        <div id="sv-modal-alert"></div>
        <form id="sv-proyecto-form" novalidate>
          <input type="hidden" id="sv-proyecto-id" />
          <div class="sv-form-group">
            <label class="sv-label" for="proj-titulo">Título del proyecto</label>
            <input type="text" id="proj-titulo" class="sv-input"
              placeholder="Ej: Distribución de anfibios en la Sierra Madre" required />
            <span class="sv-field-error" id="titulo-error" data-error="titulo"></span>
          </div>
          <div class="sv-form-group">
            <label class="sv-label" for="proj-categoria">Categoría</label>
            <select id="proj-categoria" class="sv-input" style="width:100%;" required>
              <option value="">Selecciona una categoría</option>
              <option value="CLIMA">Clima</option>
              <option value="FAUNA">Fauna</option>
              <option value="AGUA">Agua</option>
              <option value="SUELO">Suelo</option>
              <option value="VEGETACION">Vegetación</option>
              <option value="ATMOSFERA">Atmósfera</option>
              <option value="OTRO">Otro</option>
            </select>
            <span class="sv-field-error" id="categoria-error" data-error="categoria"></span>
          </div>
          <div class="sv-form-group">
            <label class="sv-label" for="proj-descripcion">Descripción</label>
            <textarea id="proj-descripcion" class="sv-input" rows="3"
              placeholder="Describe el objetivo y metodología del proyecto..."
              style="resize:vertical;"></textarea>
            <span class="sv-field-error" id="descripcion-error" data-error="descripcion"></span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="sv-form-group">
              <label class="sv-label" for="proj-fecha-inicio">Fecha inicio</label>
              <input type="date" id="proj-fecha-inicio" class="sv-input" />
            </div>
            <div class="sv-form-group">
              <label class="sv-label" for="proj-fecha-fin">Fecha fin</label>
              <input type="date" id="proj-fecha-fin" class="sv-input" />
            </div>
          </div>
          <div class="sv-form-group">
            <label class="sv-label" for="proj-etiquetas">Etiquetas (separadas por comas)</label>
            <input type="text" id="proj-etiquetas" class="sv-input" placeholder="biodiversidad, SIG, México" />
          </div>
          <div style="display:flex;gap:10px;margin-top:8px;">
            <button type="button" class="sv-btn sv-btn-ghost" id="sv-modal-cancel-btn">Cancelar</button>
            <button type="submit" class="sv-btn sv-btn-primary sv-btn-block" id="sv-modal-submit-btn">
              Guardar proyecto
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { showAlert, clearAlert, showFieldErrors, clearFieldErrors, setButtonLoading, formatDate, formatNumber } from './js/ui.js';
    import { Router } from './js/router.js';
    import { Auth } from './js/auth.js';
    import { API } from './js/api.js';

    if (!Router.requireRole(['INVESTIGADOR', 'ADMIN'])) throw new Error('Unauthorized');

    const user = Auth.getUser();
    const nombre = user?.nombre_completo || user?.username || 'Usuario';
    document.getElementById('sv-panel-title').textContent = `Bienvenido, ${nombre}`;

    // ─────────────────────────────────────────────────
    // CONSTANTES
    // ─────────────────────────────────────────────────
    const CATEGORY_ICONS  = { CLIMA:'🌤', FAUNA:'🦎', AGUA:'💧', SUELO:'🌍', VEGETACION:'🌿', ATMOSFERA:'🌬', OTRO:'◈' };
    const CATEGORY_LABELS = { CLIMA:'Clima', FAUNA:'Fauna', AGUA:'Agua', SUELO:'Suelo', VEGETACION:'Vegetación', ATMOSFERA:'Atmósfera', OTRO:'Otro' };
    const CATEGORY_COLORS = { CLIMA:'cyan', FAUNA:'green', AGUA:'teal', SUELO:'amber', VEGETACION:'green', ATMOSFERA:'cyan', OTRO:'dim' };
    const ACT_COLORS      = { capa:'#00d4ff', proyecto:'#00e5aa', validacion:'#ffb700', error:'#ff6b6b', usuario:'#c792ea' };

    let state = { page:1, pageSize:10, q:'', visibilidad:'', categoria:'', ordering:'-fecha_actualizacion' };
    let searchTimer;

    // ─────────────────────────────────────────────────
    // CARGA DE DATOS
    // ─────────────────────────────────────────────────
    async function loadPanel() {
      try {
        const qp = new URLSearchParams({ page:state.page, page_size:state.pageSize, ordering:state.ordering });
        if (state.q)           qp.set('q', state.q);
        if (state.visibilidad) qp.set('visibilidad', state.visibilidad);
        if (state.categoria)   qp.set('categoria', state.categoria);

        const data = await API.get(`/api/proyectos/mis/?${qp}`);
        renderMetrics(data.metricas || {});
        renderProyectos(data.results || []);
        renderPaginacion(data.total || 0, data.pages || 1);
      } catch (err) {
        showAlert('sv-panel-alert', err.message || 'Error al cargar proyectos.', 'error');
      }
    }

    async function loadActividad() {
      try {
        const data = await API.get('/api/actividad/?page_size=10');
        renderActividad(data.results || []);
      } catch {
        renderActividadFallback();
      }
    }

    // ─────────────────────────────────────────────────
    // RENDER: Métricas
    // ─────────────────────────────────────────────────
    function renderMetrics(m) {
      document.getElementById('sv-stats-row').innerHTML = `
        <div class="sv-metric-card">
          <div class="sv-metric-value" style="color:var(--accent-cyan);">${m.total_proyectos ?? 0}</div>
          <div class="sv-metric-label">Total proyectos</div>
        </div>
        <div class="sv-metric-card">
          <div class="sv-metric-value" style="color:var(--accent-teal);">${m.publicados ?? 0}</div>
          <div class="sv-metric-label">Publicados</div>
        </div>
        <div class="sv-metric-card">
          <div class="sv-metric-value" style="color:var(--text-secondary);">${m.privados ?? 0}</div>
          <div class="sv-metric-label">Privados</div>
        </div>
        <div class="sv-metric-card">
          <div class="sv-metric-value" style="color:#ffb700;">${formatNumber(m.total_features ?? 0)}</div>
          <div class="sv-metric-label">Features geo</div>
        </div>`;
    }

    // ─────────────────────────────────────────────────
    // RENDER: Proyectos
    // ─────────────────────────────────────────────────
    function renderProyectos(proyectos) {
      const list = document.getElementById('sv-proyectos-list');

      if (!proyectos.length) {
        list.innerHTML = `
          <div style="text-align:center;padding:48px 20px;color:var(--text-muted);">
            <div style="font-size:36px;margin-bottom:10px;opacity:0.3;">🗺</div>
            <p style="font-family:var(--font-mono);font-size:11px;letter-spacing:1px;">
              ${state.q || state.visibilidad || state.categoria
                ? 'Sin resultados para este filtro.'
                : 'Aún no tienes proyectos. ¡Crea el primero!'}
            </p>
          </div>`;
        return;
      }

      list.innerHTML = proyectos.map(p => {
        const cat      = p.categoria || 'OTRO';
        const icon     = CATEGORY_ICONS[cat]  || '◈';
        const color    = CATEGORY_COLORS[cat] || 'dim';
        const label    = CATEGORY_LABELS[cat] || cat;
        const isPublic = p.visibilidad === 'PUBLICO';
        const tieneCapa = (p.capas_aprobadas || 0) > 0;

        return `
          <div class="sv-proyecto-card">
            <div class="sv-proyecto-card-thumb">
              ${p.thumbnail ? `<img src="${p.thumbnail}" alt="" style="width:100%;height:100%;object-fit:cover;" />` : icon}
            </div>
            <div class="sv-proyecto-card-body">
              <div class="sv-proyecto-card-title">${escapeHtml(p.titulo)}</div>
              <div class="sv-proyecto-card-meta">
                <span class="sv-tag sv-tag-${color}">${icon} ${label}</span>
                <span>${p.num_capas || 0} capas</span>
                <span>${formatNumber(p.total_features || 0)} features</span>
                <span>Act. ${formatDate(p.fecha_actualizacion)}</span>
              </div>
              <div class="sv-proyecto-card-actions">
                <!-- Subir capa -->
                <a href="subir-capa.html?proyecto=${p.id}"
                   class="sv-btn sv-btn-ghost sv-btn-sm"
                   title="Subir capa geoespacial"
                   style="font-size:11px;">↑ Capa</a>

                <!-- Ver mapa -->
                <a href="dashboard.html?proyecto=${p.id}"
                   class="sv-btn sv-btn-ghost sv-btn-sm"
                   title="${tieneCapa ? 'Ver en mapa interactivo' : 'Sin capas aún'}"
                   style="font-size:11px;${!tieneCapa ? 'opacity:0.35;pointer-events:none;' : ''}">
                   🗺️ Mapa</a>

                <!-- Separador -->
                <span style="width:1px;height:20px;background:var(--border-dim);align-self:center;"></span>

                <!-- Toggle público/privado -->
                <label title="${isPublic ? 'Público — clic para privatizar' : 'Privado — clic para publicar'}"
                  style="display:flex;align-items:center;gap:5px;cursor:pointer;">
                  <div class="sv-toggle-sm ${isPublic ? 'on' : ''}" data-toggle-id="${p.id}"></div>
                  <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted);">
                    ${isPublic ? 'Público' : 'Privado'}
                  </span>
                </label>

                <!-- Editar -->
                <button class="sv-btn sv-btn-ghost sv-btn-sm" data-edit-id="${p.id}" title="Editar">✎</button>

                <!-- Eliminar -->
                <button class="sv-btn sv-btn-danger sv-btn-sm" data-delete-id="${p.id}" title="Eliminar">✕</button>
              </div>
            </div>
          </div>`;
      }).join('');

      // Toggle visibilidad
      list.querySelectorAll('[data-toggle-id]').forEach(div => {
        div.addEventListener('click', async () => {
          try {
            await API.post(`/api/proyectos/${div.dataset.toggleId}/toggle/`, {});
            loadPanel();
          } catch (err) {
            showAlert('sv-panel-alert', err.message, 'error');
          }
        });
      });

      list.querySelectorAll('[data-edit-id]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.editId, proyectos));
      });

      list.querySelectorAll('[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', () => confirmDelete(btn.dataset.deleteId));
      });
    }

    // ─────────────────────────────────────────────────
    // RENDER: Actividad reciente
    // ─────────────────────────────────────────────────
    function renderActividad(items) {
      const el = document.getElementById('sv-activity-list');
      if (!items.length) { renderActividadFallback(); return; }

      const TYPE_COLOR = {
        'SUBIDA':      '#00d4ff', 'APROBADO': '#00e5aa', 'ERROR': '#ff6b6b',
        'ELIMINACION': '#ff6b6b', 'CREACION': '#00e5aa', 'EDICION':'#c792ea',
        'TOGGLE':      '#ffb700',
      };

      el.innerHTML = items.map(a => {
        const color = TYPE_COLOR[a.accion] || 'var(--text-muted)';
        const time  = a.fecha ? formatTimeAgo(a.fecha) : '';
        return `
          <div class="sv-activity-item">
            <div class="sv-activity-dot" style="background:${color};"></div>
            <div class="sv-activity-text">
              <strong>${a.usuario_nombre || 'Sistema'}</strong> ${a.descripcion || a.accion?.toLowerCase() || ''}
              ${a.objeto_nombre ? `<a href="#">${escapeHtml(a.objeto_nombre)}</a>` : ''}
            </div>
            <span class="sv-activity-time">${time}</span>
          </div>`;
      }).join('');
    }

    function renderActividadFallback() {
      // Mostrar actividad generada desde los proyectos locales si el endpoint no existe aún
      const el = document.getElementById('sv-activity-list');
      el.innerHTML = `
        <div style="padding:20px 18px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;">
          Sin actividad reciente registrada
        </div>`;
    }

    function formatTimeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1)  return 'ahora';
      if (m < 60) return `hace ${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `hace ${h}h`;
      return `hace ${Math.floor(h/24)}d`;
    }

    // ─────────────────────────────────────────────────
    // PAGINACIÓN
    // ─────────────────────────────────────────────────
    function renderPaginacion(total, pages) {
      const el = document.getElementById('sv-panel-pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }

      let html = `<button class="sv-page-btn" ${state.page<=1?'disabled':''} id="pp-prev">←</button>`;
      for (let i = 1; i <= pages; i++) {
        html += `<button class="sv-page-btn ${i===state.page?'active':''}" data-page="${i}">${i}</button>`;
      }
      html += `<button class="sv-page-btn" ${state.page>=pages?'disabled':''} id="pp-next">→</button>`;
      el.innerHTML = html;

      el.querySelectorAll('[data-page]').forEach(b =>
        b.addEventListener('click', () => { state.page = +b.dataset.page; loadPanel(); })
      );
      document.getElementById('pp-prev')?.addEventListener('click', () => { if(state.page>1){state.page--;loadPanel();} });
      document.getElementById('pp-next')?.addEventListener('click', () => { if(state.page<pages){state.page++;loadPanel();} });
    }

    // ─────────────────────────────────────────────────
    // MODAL NUEVO / EDITAR
    // ─────────────────────────────────────────────────
    function openModal(title = 'Nuevo proyecto') {
      document.getElementById('sv-modal-title').textContent = title;
      document.getElementById('sv-modal-overlay').style.display = 'block';
      clearAlert('sv-modal-alert');
      clearFieldErrors('sv-proyecto-form');
    }

    function closeModal() {
      document.getElementById('sv-modal-overlay').style.display = 'none';
      document.getElementById('sv-proyecto-form').reset();
      document.getElementById('sv-proyecto-id').value = '';
    }

    function openEditModal(id, proyectos) {
      const p = proyectos.find(x => x.id === id); if (!p) return;
      document.getElementById('sv-proyecto-id').value   = id;
      document.getElementById('proj-titulo').value       = p.titulo || '';
      document.getElementById('proj-categoria').value    = p.categoria || '';
      document.getElementById('proj-descripcion').value  = p.descripcion || '';
      document.getElementById('proj-fecha-inicio').value = p.fecha_inicio || '';
      document.getElementById('proj-fecha-fin').value    = p.fecha_fin || '';
      document.getElementById('proj-etiquetas').value    =
        Array.isArray(p.etiquetas) ? p.etiquetas.join(', ') : (p.etiquetas || '');
      openModal('Editar proyecto');
    }

    async function confirmDelete(id) {
      if (!confirm('¿Eliminar este proyecto? Esta acción es irreversible.')) return;
      try {
        await API.delete(`/api/proyectos/${id}/`);
        showAlert('sv-panel-alert', 'Proyecto eliminado.', 'success');
        loadPanel();
      } catch (err) {
        showAlert('sv-panel-alert', err.message, 'error');
      }
    }

    document.getElementById('sv-new-proyecto-btn').addEventListener('click', () => {
      document.getElementById('sv-proyecto-id').value = '';
      document.getElementById('sv-proyecto-form').reset();
      openModal('Nuevo proyecto');
    });

    document.getElementById('sv-modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('sv-modal-cancel-btn').addEventListener('click', closeModal);
    document.getElementById('sv-modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('sv-proyecto-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearAlert('sv-modal-alert');
      clearFieldErrors('sv-proyecto-form');

      const id = document.getElementById('sv-proyecto-id').value;
      const etiquetas = document.getElementById('proj-etiquetas').value
        .split(',').map(s=>s.trim()).filter(Boolean);

      const payload = {
        titulo:       document.getElementById('proj-titulo').value.trim(),
        categoria:    document.getElementById('proj-categoria').value,
        descripcion:  document.getElementById('proj-descripcion').value.trim(),
        fecha_inicio: document.getElementById('proj-fecha-inicio').value || null,
        fecha_fin:    document.getElementById('proj-fecha-fin').value || null,
        etiquetas,
      };

      const submitBtn = document.getElementById('sv-modal-submit-btn');
      setButtonLoading(submitBtn, true);

      try {
        if (id) {
          await API.patch(`/api/proyectos/${id}/`, payload);
          showAlert('sv-panel-alert', 'Proyecto actualizado.', 'success');
        } else {
          await API.post('/api/proyectos/', payload);
          showAlert('sv-panel-alert', 'Proyecto creado exitosamente.', 'success');
        }
        closeModal();
        loadPanel();
      } catch (err) {
        setButtonLoading(submitBtn, false);
        const fe = err.getFieldErrors?.() || {};
        if (Object.keys(fe).length) showFieldErrors(fe, 'sv-proyecto-form');
        else showAlert('sv-modal-alert', err.message || 'Error al guardar.', 'error');
      }
    });

    // Filtros
    document.getElementById('sv-panel-search').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.q = e.target.value.trim(); state.page=1; loadPanel(); }, 400);
    });
    document.getElementById('sv-vis-filter').addEventListener('change', e => {
      state.visibilidad = e.target.value; state.page=1; loadPanel();
    });
    document.getElementById('sv-cat-filter').addEventListener('change', e => {
      state.categoria = e.target.value; state.page=1; loadPanel();
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Arrancar

    // ── Sidenav: inicializar usuario y eventos ─────────────
    (function() {
      const user   = JSON.parse(localStorage.getItem('sivag_user') || '{}');
      const nombre = user.nombre_completo || user.username || 'Usuario';
      const rol    = user.rol === 'ADMIN' ? 'Administrador' : 'Investigador';
      const avatar = nombre.charAt(0).toUpperCase();

      const elNombre = document.getElementById('sv-nav-nombre');
      const elRol    = document.getElementById('sv-nav-rol');
      const elAvatar = document.getElementById('sv-nav-avatar');
      if (elNombre) elNombre.textContent = nombre;
      if (elRol)    elRol.textContent    = rol;
      if (elAvatar) elAvatar.textContent = avatar;

      const sidenav    = document.getElementById('sv-sidenav');
      const collapseBtn= document.getElementById('sv-nav-collapse-btn');
      const collapseIco= document.getElementById('sv-nav-collapse-icon');
      let collapsed    = false;

      collapseBtn?.addEventListener('click', () => {
        collapsed = !collapsed;
        sidenav.classList.toggle('collapsed', collapsed);
        if (collapseIco) collapseIco.textContent = collapsed ? '▷' : '◁';
      });

      document.getElementById('sv-nav-logout-btn')?.addEventListener('click', () => {
        localStorage.removeItem('sivag_access');
        localStorage.removeItem('sivag_refresh');
        localStorage.removeItem('sivag_user');
        window.location.href = 'login.html';
      });
    })();

    loadPanel();
    loadActividad();
  </script>
</body>
</html>
